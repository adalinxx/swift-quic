name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode with Swift 6.3
        run: |
          for XCODE in $(ls -d /Applications/Xcode_*.app | sort -rV); do
            SWIFT="$XCODE/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
            if "$SWIFT" --version 2>/dev/null | head -1 | grep -q "Swift version 6\.3"; then
              sudo xcode-select -s "$XCODE"
              break
            fi
          done
      - name: Generate DocC
        run: |
          SWIFT_CERTIFICATES_ALLOW_SWIFT_CRYPTO_BETA=1 swift package \
            --allow-writing-to-directory docs-out \
            generate-documentation --target QUIC \
            --transform-for-static-hosting \
            --hosting-base-path swift-quic \
            --output-path docs-out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
