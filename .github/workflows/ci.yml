name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    name: Build and test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Build
        run: SWIFT_CERTIFICATES_ALLOW_SWIFT_CRYPTO_BETA=1 swift build --build-tests
      - name: Test
        run: SWIFT_CERTIFICATES_ALLOW_SWIFT_CRYPTO_BETA=1 swift test --parallel
