name: Nightly soak

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  soak:
    name: 60s sustained mixed workload
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode with Swift 6.3
        run: |
          for XCODE in $(ls -d /Applications/Xcode_*.app | sort -rV); do
            SWIFT="$XCODE/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
            if "$SWIFT" --version 2>/dev/null | head -1 | grep -q "Swift version 6\.3"; then
              sudo xcode-select -s "$XCODE"
              break
            fi
          done
          swift --version
      - name: Soak
        run: |
          SWIFT_CERTIFICATES_ALLOW_SWIFT_CRYPTO_BETA=1 SWIFT_QUIC_SOAK=1 \
            swift test --filter SoakTests
